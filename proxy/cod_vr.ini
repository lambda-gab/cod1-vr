[Stereo]
; 0 = proxy only forwards to the system opengl32 (no stereo, no VR)
Enabled=1
; side-by-side mode (no headset): distance between the two cameras in game units (1 unit ~ 2.5 cm)
Separation=2.5
; side-by-side mode: 1 = right eye on the left (cross-eyed viewing)
SwapEyes=0

[VR]
; 1 = send the image to the OpenXR headset when one is connected
Enabled=1
; game units per metre (CoD: 1 unit = 1 inch)
WorldScale=39.37
; degrees drawn beyond each side of the view: on quick head turns the headset shows a bit past the
; edge of the frame (reprojection); a small margin stops things flashing in there. 0 .. 30
CullMargin=10
; eye resolution, times the headset's recommended size (1 = native; lower it if the game is slow,
; e.g. 0.8; above 1 is sharper but heavier). Changes need a game restart.
RenderScale=1.0
; antialiasing of the eye images: 1 (off), 2, 4 or 8 samples (smooth edges, less shimmer; costs GPU)
MSAA=4
; anisotropic texture filtering: 1 (off) .. 16 (floors and walls sharp at an angle)
Anisotropy=16
; metres added to your height in the game (negative = shorter); recenter with the left stick click
HeightOffset=0
; 1 = head position moves the camera (6DoF), 0 = rotation only
PositionalTracking=1
; 1 = the game's view follows the aim (gun hand, or the head without controllers)
HeadAim=1
; 1 = the player in the game walks to where your head is (lean out of windows, peek around
; corners: the game, its bullets and the enemies follow your real position; walls still stop you)
RoomScale=1
; 1 = the view stops a little before a wall when you lean or walk into it (it went into door
; frames and corners), 0 = it goes wherever your head goes
HeadCollision=1


[Comfort]
; 1 = the view narrows while you move with the stick or turn smoothly (helps against VR sickness);
; walking for real and snap turns do not narrow it
Vignette=1
; how far it closes, 0 (not at all) .. 1 (to a small circle)
VignetteStrength=0.6
; game units per second you must be moving for it to close (fully at twice; walking is about 190);
; how far it closes then follows how far the stick is pushed
VignetteSpeed=40
; smooth turning, degrees per second where it starts closing
VignetteTurn=45
; the vignette while a vehicle carries you (truck, car, plane), from its speed and turns:
; strength 0 (off) .. 1
VehicleVignette=0.6

[PostFX]
; image effects in the headset, applied after the game draws
; sharpening, 0 (off) .. 1 (strong): gives the old textures their definition back
Sharpen=0
; colour style: original (the game's own), natural, cinema (muted, warm war film), vivid
Color=original
; glow around bright light (fire, explosions, sky): 0 = off, 0.15 = low, 0.3 = medium
Bloom=0
; brightness where the glow starts, 0 .. 0.95
BloomThreshold=0.7
; ambient occlusion: contact shadows where surfaces meet (corners, under objects): 0 = off .. 1
AmbientOcclusion=0
; how far the shadows reach, game units (20 = about half a metre)
AmbientOcclusionRadius=20
[HUD]
; 1 = HUD, objectives and menus on a flat screen in front of you (VR only)
Enabled=1
; 1 = the screen follows your head, 0 = it stays fixed in the room
HeadLocked=1
; menus and loading screens: 1 = follow the head too, 0 = appear in front of you and stay there
MenuFollowsHead=0
; 1 = while the objectives button is held, the objectives screen shows above your left hand
ObjectivesOnHand=1
; what of the game's HUD stays on screen (holding Objectives shows all of it): 0 everything,
; 1 nothing (immersive), 2 subtitles only, 3 compass only, 4 health and ammo only
HudMode=0
; how big the subtitles are: 1 = the game's own size, 1.5 = Medium, 2.2 = Large, 3 = Extra Large
; (any number from 0.3 to 6; the launcher's VR tab offers the four)
SubtitleSize=1
; 1 = the game's text in a modern, more legible font (Segoe UI, drawn by the installer
; from the one in Windows: main\pakz_vr_font.pk3), 0 = the original font
ModernFont=1
; its width and height above the hand, metres
ObjectivesWidth=0.52
ObjectivesHeight=0.15
; opacity of the dark rounded panel behind them, 0 (none) .. 1
ObjectivesBackground=0.72
; room between the panel's edge and the objectives, share of the screen on each side (0 .. 0.2)
ObjectivesMargin=0.02
; metres in front of the eyes
Distance=1.5
; metres up (negative = down)
OffsetY=-0.05
; screen width in metres while playing, and in menus
Width=1.0
MenuWidth=1.8

[Controllers]
; 1 = aim with the gun hand, move with the other stick, buttons run game commands
Enabled=1
; 1 = right-handed: the right stick turns, the left one moves, the right hand points in menus
RightHanded=1
; which stick moves you: 0 = the left stick moves and the right one turns, 1 = the right stick
; moves and the left one turns (whichever hand holds the gun)
MoveStick=0
; degrees per flick of the turn stick, 0 = smooth turn
SnapTurn=45
; smooth turn speed, degrees per second
SmoothTurnSpeed=150
; metres along the gun where the shots cross the barrel line
ConvergeDistance=15
; 1 = the view weapon follows the gun hand
WeaponInHand=1
; where the gun sits relative to the eye in the original game (game units, ~2.5 cm):
; that spot is placed in your hand. Tune these if the grip is not in your hand.
WeaponOffsetForward=10
WeaponOffsetRight=5
WeaponOffsetUp=-7
; gun angle relative to the controller, degrees: pitch (positive = barrel up) and yaw (positive = left)
WeaponPitch=0
WeaponYaw=0
; smooths the gun direction (seconds, e.g. 0.03); 0 = off. Steadier aim, slightly more lag
AimSmoothing=0
; 1 = raising the gun to your eye and lining it up aims down the sights (+speed). Off by default:
; the game moves the view weapon to its sights position, away from your hands
AutoADS=0
; 1 = the other hand's grip in front of the gun hand holds it with both hands
TwoHanded=1
; metres between the hands within which that grip takes the gun
TwoHandReach=0.7
; metres the left hand holds below the barrel line (raise it if the hand looks too low on the gun)
TwoHandGripHeight=0.04
; held with both hands: aim steadiness, 0 (off) .. 1 (steadiest; deliberate swings still follow quickly)
TwoHandStabilization=0.75
; held with both hands: share of the recoil (gun and view kick) taken away, 0 .. 1
TwoHandRecoilReduction=0.8
; muzzle flash position across the barrel, game units (the flat game drew it near the screen centre)
MuzzleOffsetRight=-2.5
MuzzleOffsetUp=0
; Weapons are taken from your body with either hand and held while the grip is pressed:
; over the right shoulder (hand behind your head) the first long gun, over the left shoulder the
; second, at your hip the pistol, behind you from the waist to the lower back a grenade. Let go
; where the weapon belongs to put it back; let go anywhere else and it falls to the floor (grab it
; with an empty hand to pick it up). An empty hand's grip is use (doors, pickups). Either trigger
; fires; with a scoped rifle the other hand's trigger zooms. Settings in [Holsters].
; controller vibration: 0 = off, 0.6 = normal, 1 = strong (holsters, shots, taking and dropping weapons)
Haptics=0.6
; by kind (the value above when a line is missing): shots, being hit, holsters and weapons in the hand
HapticsShots=0.6
HapticsDamage=0.6
HapticsHolsters=0.6
; 1 = crouching for real crouches the soldier (and standing up stands him)
PhysicalCrouch=1
; metres your head goes below its standing height to crouch
CrouchDepth=0.32
; a crosshair where the gun is aimed (for playing without aiming down the sights): 0 none, 1 cross,
; 2 dot, 3 circle, 4 circle + dot, 5 cross + dot; its size in degrees
Crosshair=0
CrosshairSize=1.5
; 1 = swinging the gun into someone is a melee hit (any part of the gun); how fast it must move, m/s
SwingMelee=1
MeleeSpeed=2.2
; 1 = a gun held in the left hand is drawn mirrored (the game's models are right-handed)
MirrorLeftHand=1
; with empty hands: 0 = the head aims (looking at something is enough, as at the training signs),
; 1 = the right hand aims with a line in the training until its first objective, 2 = always the hand
EmptyHandPointer=0
; 1 = shots fired without the game's aim-down-sights button are as accurate as aimed ones
; (in VR you aim with the gun's own sights); 0 = the game's hip fire spread
HipFireAccuracy=1
; 1 = in menus, point with the gun hand to move the cursor; either trigger clicks,
; B or Menu goes back, A confirms, the turn stick scrolls
MenuPointer=1

[Buttons]
; game commands; "+command" is held while the button is pressed. Empty = nothing.
; "key:NAME" presses a key instead (ESCAPE, ENTER, TAB, SPACE, BACKSPACE, arrows, MOUSE1-3, or one letter).
; Primary = gun hand, Secondary = other hand. A/B are on the right controller, X/Y on the left.
PrimaryTrigger=+attack
; use / pick up: an empty hand's grip
PrimaryGrip=+activate
; scoped rifles: zoom, with the trigger of the hand that is not holding the gun
SecondaryTrigger=+speed
; not used: the grips take and hold the weapons
SecondaryGrip=
A=+gostand
B=+reload
; objectives (weapons are taken from your body, see [Holsters])
X=+scores
Y=+melee
; recenter: stand up straight and press (your height and the roomscale centre); "vr:recenter"
LeftStickClick=vr:recenter
RightStickClick=toggleprone
; opens the game menu (the game only does that on the Escape key)
Menu=key:ESCAPE
; turn stick pushed up / down
TurnStickUp=raisestance
TurnStickDown=lowerstance

[Scope]
; 1 = while the game zooms in (scoped rifle aimed with SecondaryTrigger, binoculars), the HUD
; screen shows the game's own zoomed view behind its scope overlay; the reticle is where you hit
Enabled=1
; the game fov (degrees) below which this happens; iron sights zoom to about 50
MaxFov=35
; the scope screen replaces everything while zoomed: width and distance in metres
Width=1.4
Distance=0.7
; steadier aim while the scope is up: time constant of the gun direction filter in seconds
; (higher = steadier but lags your hand more; 0 = use AimSmoothing)
Smoothing=0.15

[Debug]
; 1 = diagnostics in cod_vr.log (models near the view while firing, grenade data, stats per second)
LogNearEntities=0
; 1 = draw the right eye's scene first (to find out whether a glitch follows the first eye drawn)
RightEyeFirst=0

[Holsters]
; 1 = letting go of the gun away from a holster drops it on the floor, 0 = it is put away
DropOnRelease=1
; holster heights in metres from your eyes (negative = below): the hand reaches the back above
; BackHeight and behind the head; the pistol is at the hand's side at HipHeight; grenades behind
; the lower back at LowerBackHeight
BackHeight=-0.30
HipHeight=-0.75
LowerBackHeight=-0.70
; weapon over each shoulder: primary, primaryb, pistol, grenade or smokegrenade (left-handed
; players may want them swapped). With one long gun only, either shoulder gives it.
RightShoulder=primary
LeftShoulder=primaryb
; msec to put a weapon away and raise the next one, instead of the game's animations (0 = keep them)
DrawTime=50

[MuzzleFlash]
; per-weapon correction of the muzzle flash, added to the values above:
; name=forward right up, in game units (1 = 2.5 cm). name is part of the weapon's internal name;
; cod_vr.log says which name you are holding; Default is for every weapon without its own line.
; Read again every second: edit and save while playing.
; some weapons (the Thompson) draw a longer flash made of several sprites: this scales its length
; (1 = as in the flat game, about 45 cm)
WorldFlashLength=0.25
Default=0 0 4

[Grenade]
; grenade trajectory: 0 = off, 1 = while the trigger is held with a grenade (it is thrown on release),
; 2 = whenever a grenade is in your hand. The line stops where it hits the map (walls, floor,
; window frames); bounces are not simulated.
Trajectory=1
; game gravity (g_gravity), units per second squared
Gravity=800
; line opacity, 0.05 (faint) .. 1 (solid white)
Opacity=0.6
; contents the line collides with (1 = solid map geometry)
TraceMask=1

[Mods]
; 1 = the reserve ammunition stays full, 2 = the clip too (no reloading)
InfiniteAmmo=0
; 0 normal, 1 real life (one hit kills, you and them), 2 perma death (dying ends the run: the
; checkpoints are erased, saves made by hand go to main\save\permadeath_backup), 3 both,
; 4 god mode (you never die)
Difficulty=0
; 0 no blood, 1 the game's blood, 2 gore (more blood that sprays and falls: main\pakz_vr_gore.pk3,
; made by the installer from the game's own effect)
Gore=1

[Turret]
; where you stand relative to a mounted MG42, in cm, in the gun's own directions (as it was when
; mounted): OffsetX along the barrel (negative = further back), OffsetY to its left, OffsetZ up.
; Read again every second, so it can be tuned while playing
OffsetX=0
OffsetY=0
OffsetZ=0
; 1 = the gun is not solid for you while you are mounted (it pushed the player when aimed down)
NoCollision=1
